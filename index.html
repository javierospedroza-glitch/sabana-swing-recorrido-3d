<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sabana Swing · Recorrido 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<style>/*
VOICE: club de golf contemporáneo, sereno y preciso.
IDEA: la tarjeta de puntuación y el letrero de hoyo de un torneo, flotando sobre el recinto 3D.
PICTURE: el propio recinto 3D a pantalla completa; la interfaz solo enmarca.
COLOUR and TYPE: verde profundo translúcido, marfil, dorado discreto; Marcellus + Inter.
LAYOUT: barra superior, menú de zonas a la izquierda, tarjeta de estación abajo, plano abajo a la derecha, ficha a la derecha.
*/
:root{color-scheme:dark;--g:#0f2a20;--g2:#17392b;--panel:rgba(12,34,26,.78);--line:rgba(226,201,143,.28);--iv:#f3eddf;--iv2:#cfc6b2;--gold:#c9a55a;--gold2:#e2c98f;--serif:"Marcellus","Cormorant Garamond",Georgia,serif;--sans:"Inter","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;min-width:0}
html,body,#root{margin:0;height:100%;overflow:hidden;background:#0b1f18;color:var(--iv);font:15px/1.5 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
kbd{display:inline-block;min-width:22px;padding:1px 6px;margin:0 2px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;font:600 12px var(--sans);text-align:center;color:var(--gold2)}
.app{position:fixed;inset:0}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.scene:active{cursor:grabbing}
.panel,.top .brand,.tools .seg,.ib,.zones-toggle,.zones ol,.station,.hint,.map,.info,.intro{background:var(--panel);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}

.top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.brand{display:flex;gap:10px;align-items:center;padding:8px 14px 8px 8px;max-width:440px}
.mark{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--g2);color:var(--gold);border:1px solid var(--gold)}
.brand h1{margin:0;font:400 19px/1.1 var(--serif);letter-spacing:.01em}
.brand p{margin:2px 0 0;font-size:12px;color:var(--iv2);line-height:1.3}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;padding:3px;gap:2px}
.seg button{padding:7px 11px;border-radius:10px;font-size:13px;color:var(--iv2);white-space:nowrap;min-height:36px}
.seg button.on{background:var(--gold);color:var(--g);font-weight:600}
.seg button:not(.on):hover{color:var(--iv);background:rgba(255,255,255,.06)}
.ib{display:flex;align-items:center;gap:6px;padding:0 12px;min-height:42px;font-size:13px;color:var(--iv2)}
.ib.on{color:var(--gold2)}
.ib:hover{color:var(--iv)}

.zones{position:absolute;left:12px;top:86px;z-index:4;display:flex;flex-direction:column;gap:6px;width:236px}
.zones-toggle{display:flex;gap:8px;align-items:center;padding:0 12px;min-height:40px;width:max-content;font-size:13px;color:var(--iv2)}
.zones ol{list-style:none;margin:0;padding:6px}
.zones li button{display:flex;gap:10px;align-items:center;width:100%;padding:7px 8px;border-radius:9px;text-align:left;font-size:13.5px;color:var(--iv2);min-height:38px}
.zones li button b{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);font:600 12px var(--sans);color:var(--gold2)}
.zones li button:hover{background:rgba(255,255,255,.06);color:var(--iv)}
.zones li button.on{background:rgba(201,165,90,.18);color:var(--iv)}
.zones li button.on b{background:var(--gold);color:var(--g);border-color:var(--gold)}

.intro{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);width:min(560px,calc(100% - 32px));padding:30px 32px 24px;text-align:center;z-index:6;background:rgba(12,34,26,.82)}
.kicker{display:block;font-size:12px;color:var(--gold2);font-weight:600;letter-spacing:.02em;margin-bottom:8px}
.intro h2{margin:0 0 10px;font:400 clamp(26px,3.4vw,36px)/1.08 var(--serif);text-wrap:balance}
.intro p{margin:0 auto 20px;max-width:46ch;color:var(--iv2)}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cta button{display:flex;align-items:center;gap:8px;padding:0 18px;min-height:48px;border-radius:12px;font-weight:600}
.primary{background:var(--gold);color:var(--g)}
.primary:hover{background:var(--gold2)}
.ghost{border:1px solid var(--gold)!important;color:var(--gold2)}
.ghost:hover{background:rgba(201,165,90,.12)}
.intro small{display:block;margin-top:16px;color:#9fb0a5;font-size:12px}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:400 22px var(--serif);color:var(--iv2);z-index:7;background:radial-gradient(circle at 50% 45%,#17392b,#081812)}
.loading.err{font:15px var(--sans);padding:24px;text-align:center}
.spin{display:inline-block;width:18px;height:18px;margin-right:10px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

.station{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(620px,calc(100% - 300px));padding:14px 16px 12px;z-index:4}
.st-head{display:flex;align-items:baseline;gap:10px}
.st-n{font:600 12px var(--sans);color:var(--gold2)}
.st-head h3{margin:0;font:400 22px/1.15 var(--serif);flex:1}
.st-z{font-size:12px;color:var(--iv2);border:1px solid var(--line);padding:1px 8px;border-radius:20px;white-space:nowrap}
.station p{margin:6px 0 10px;color:var(--iv2);font-size:14px}
.progress{display:flex;gap:4px;margin-bottom:10px}
.progress button{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.14);min-height:4px;padding:0}
.progress button.done{background:rgba(201,165,90,.5)}
.progress button.on{background:var(--gold)}
.st-ctrl{display:flex;align-items:center;gap:6px}
.st-ctrl>button:not(.text){display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);color:var(--gold2)}
.st-ctrl>button:disabled{opacity:.35;cursor:default}
.grow{flex:1;font-size:12px;color:#9fb0a5;padding-left:4px}
.text{display:flex;align-items:center;gap:6px;padding:0 10px;min-height:40px;border-radius:10px;color:var(--gold2);font-weight:600;font-size:13px}
.text:hover{background:rgba(201,165,90,.12)}

.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:6px 6px 6px 16px;font-size:13px;color:var(--iv2);z-index:4;max-width:calc(100% - 300px)}
.hint span{line-height:1.9}
.hint .text{white-space:nowrap}

.map{position:absolute;right:12px;bottom:14px;width:244px;padding:8px;z-index:4}
.map-head{display:flex;flex-direction:column;gap:1px;padding:2px 4px 6px}
.map-head span{font-size:11px;color:#9fb0a5}
.map-head b{font:400 16px/1.2 var(--serif);color:var(--iv)}
.map canvas{display:block;width:100%;height:220px;border-radius:8px;cursor:crosshair;background:#2e4a2a}

.info{position:absolute;right:12px;top:86px;width:380px;max-height:calc(100% - 385px);overflow:auto;padding:16px 18px 14px;z-index:6}
.info h3{margin:0 0 10px;font:400 24px/1.1 var(--serif);padding-right:30px}
.info dl{margin:0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:7px 12px;font-size:13.5px}
.info dt{color:var(--gold2);font-weight:600;font-size:12px;padding-top:1px}
.info dd{margin:0;color:var(--iv)}
.info dd.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.info h4{margin:14px 0 6px;font:400 17px var(--serif);color:var(--gold2)}
.content p{margin:0 0 7px;font-size:13.5px;color:var(--iv)}
.content b{color:var(--gold2)}
.ctable{width:100%;border-collapse:collapse;font-size:12.5px}
.ctable th{color:var(--gold2);text-align:left;font-weight:600;padding:4px 6px 4px 0;border-bottom:1px solid var(--line)}
.ctable td{padding:5px 6px 5px 0;border-bottom:1px solid rgba(226,201,143,.12);vertical-align:top}
.ctable td small{display:block;color:#9fb0a5;font-size:11.5px;margin-top:2px}
.ctable td:nth-child(2){white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.ctable td:nth-child(2) span{display:block}
.ctable th:nth-child(2){text-align:right}
.ctable .tot td{font-weight:700;color:var(--gold2)}
.rules{margin:0;padding-left:18px;font-size:13.5px;color:var(--iv)}
.rules li{margin-bottom:4px}
.info small{display:block;margin-top:12px;color:#9fb0a5;font-size:12px}
.x{position:absolute;top:10px;right:10px;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:var(--iv2)}
.x:hover{background:rgba(255,255,255,.08);color:var(--iv)}

.hots,.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.hot{position:absolute;left:0;top:0;width:0;height:0;opacity:0;transition:opacity .25s}
.hot .dot{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:rgba(201,165,90,.25);border:1.5px solid var(--gold2);box-shadow:0 0 0 0 rgba(226,201,143,.6);animation:pulse 2.6s ease-out infinite}
.hot .dot::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--gold2)}
.hot.small .dot{left:-8px;top:-8px;width:16px;height:16px}
.hot.small .dot::after{inset:4px}
.hot .tip{position:absolute;left:16px;top:-13px;white-space:nowrap;padding:3px 9px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:12px;opacity:0;transform:translateX(-4px);transition:.2s;pointer-events:none}
.hot:hover .tip,.hot:focus-visible .tip,.hot.on .tip{opacity:1;transform:none}
.hot::before{content:"";position:absolute;left:-22px;top:-22px;width:44px;height:44px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,201,143,.55)}70%{box-shadow:0 0 0 10px rgba(226,201,143,0)}100%{box-shadow:0 0 0 0 rgba(226,201,143,0)}}
.zlabel{position:absolute;left:0;top:0;display:flex;gap:6px;align-items:center;white-space:nowrap;transform-origin:0 0;padding:3px 10px 3px 3px;margin:-13px 0 0 -40px;border-radius:20px;background:rgba(243,237,223,.92);color:var(--g);font:400 14px var(--serif);opacity:0;transition:opacity .3s;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.zlabel b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--g2);color:var(--gold2);font:600 11px var(--sans)}

.joy{position:absolute;left:24px;bottom:28px;width:120px;height:120px;border-radius:50%;background:rgba(12,34,26,.5);border:1px solid var(--line);z-index:5;touch-action:none;display:grid;place-items:center}
.joy-knob{width:52px;height:52px;border-radius:50%;background:rgba(201,165,90,.8);border:2px solid var(--gold2)}

.modal{position:absolute;inset:0;background:rgba(5,15,11,.55);display:grid;place-items:center;z-index:10;padding:16px}
.sheet{position:relative;width:min(560px,100%);max-height:88%;overflow:auto;background:#10291f;border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.sheet h3{margin:0 0 12px;font:400 24px/1.15 var(--serif);padding-right:34px}
.sheet p{color:var(--iv2);margin:0 0 12px}
.keys{list-style:none;margin:0;padding:0}
.keys li{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid rgba(226,201,143,.14);font-size:14px;color:var(--iv2)}
.keys li span{color:var(--iv)}
.verify{margin:0 0 12px;padding-left:20px;color:var(--iv);font-size:14px}
.verify li{margin-bottom:5px}
.small{font-size:12.5px}
code{color:var(--gold2)}

@media (max-width:1400px){.ib span{display:none}.ib{padding:0 11px}}
@media (max-width:900px){
  .brand p{display:none}
  .ib span{display:none}
  .ib{padding:0 10px}
  .zones{top:auto;bottom:252px;width:auto}
  .zones ol{width:230px;max-height:40vh;overflow:auto}
  .station{left:12px;right:12px;width:auto;transform:none;bottom:250px}
  .hint{display:none}
  .info{left:12px;right:12px;width:auto;top:auto;bottom:250px;max-height:52%}
}
@media (max-width:600px){
  .top{flex-direction:column}
  .brand{max-width:none}
  .brand h1{font-size:17px}
  .seg{overflow-x:auto;max-width:calc(100vw - 24px)}
  .tools{justify-content:flex-start}
  .map{width:168px;padding:6px}
  .map canvas{height:150px}
  .map-head span{display:none}
  .station,.info,.zones{bottom:200px}
  .joy{bottom:24px}
}
@media (prefers-reduced-motion:reduce){.hot .dot{animation:none}.spin{animation:none}}
</style></head>
